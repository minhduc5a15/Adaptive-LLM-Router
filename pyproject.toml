[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-llm-router"
version = "0.1.0"
description = "Decision Tree and SVM router for two language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8,<4",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "streamlit>=1.38,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
routerbench-download = "adaptive_llm_router.download:main"

[tool.setuptools.packages.find]
where = ["src"]
